<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orange Day Digital Campaign</title>
  <style>
    body {
      background-color: #fce1d0;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      cursor: url('lazo-normal.png'), auto;
    }

    a, button {
      cursor: url('lazo-deshecho.png'), pointer;
    }

    input, textarea {
      cursor: url('lazo-escribir.png'), text;
    }

    .nav-bar {
      max-width: 1100px;
      margin: 0 auto 15px auto;
      display: flex;
      justify-content: flex-end;
    }

    .nav-link {
      background-color: #ffffff;
      border: 1.5px solid #e67e22;
      padding: 8px 16px;
      border-radius: 20px;
      color: #d35400;
      font-weight: bold;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .nav-link:hover {
      background-color: #ffe6d5;
    }

    .main-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .box {
      background-color: #ffffff;
      border: 2px dashed #e67e22;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .header-box h1 {
      margin: 10px 0;
      color: #333;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 15px;
      align-items: stretch;
    }

    .side-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: space-between;
    }

    .image-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fafafa;
      border: 1px dashed #ccc;
      border-radius: 8px;
      min-height: 120px;
      padding: 5px;
    }

    .image-area img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .link-area {
      background-color: #fff3e6;
      border: 1px solid #e67e22;
      padding: 10px;
      border-radius: 8px;
    }

    a {
      color: #d35400;
      font-weight: bold;
      text-decoration: none;
    }

    .video-box {
      min-height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fafafa;
      border: 2px dashed #d35400;
    }

    .forum-box {
      text-align: left;
      padding: 20px;
    }

    .forum-box h2 {
      margin-top: 0;
      color: #d35400;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #e67e22;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
      resize: vertical;
      margin-bottom: 10px;
    }

    button {
      background-color: #e67e22;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
    }

    button:hover {
      background-color: #d35400;
    }

    footer {
      text-align: center;
      margin-top: 25px;
      color: #b3541e;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <nav class="nav-bar">
    <a href="quienes-somos.html" class="nav-link">¿Quiénes Somos?</a>
  </nav>

  <div class="main-container">
    
    <div class="box header-box">
      <h1>EL DÍA NARANJA</h1>
    </div>

    <div class="content-grid">
      
      <div class="box side-box">
        <div class="image-area">
          <img src="imagen1.png" alt="Imagen 1">
        </div>
        
        <div class="link-area">
          <a href="podcast.html">Escuchar Podcast</a>
        </div>

        <div class="image-area">
          <img src="imagen2.png" alt="Imagen 2">
        </div>
      </div>

      <div class="box video-box">
      </div>

      <div class="box side-box">
        <div class="image-area">
          <img src="imagen3.png" alt="Imagen 3">
        </div>

        <div class="link-area">
          <a href="infografia.html">Ver Infografía</a>
        </div>

        <div class="image-area">
          <img src="imagen4.png" alt="Imagen 4">
        </div>
      </div>

    </div>

    <div class="box forum-box">
      <h2>Foro de Opinión</h2>
      <textarea rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
      <button type="button">Publicar comentario</button>
    </div>

  </div>

  <footer>
    <p>Orange Day Digital Campaign</p>
  </footer>

</body>
</html>
