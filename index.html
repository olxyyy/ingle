<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orange Day Digital Campaign</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://ihemqvyeziwyaqxzbupq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloZW1xdnlleml3eWFxeHpidXBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NzU1NzgsImV4cCI6MjEwNTI1MTU3OH0.6013KVtgYpE5MWI1EwU4kVYL7d0SFHKmHmM8vW1LBGE';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <style>
    body {
      background-color: #fce1d0;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      cursor: url('lazo-normal.png'), auto;
    }

    a, button {
      cursor: url('lazo-deshecho.png'), pointer;
    }

    input, textarea {
      cursor: url('lazo-escribir.png'), text;
    }

    .nav-bar {
      max-width: 1100px;
      margin: 0 auto 15px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-link, .account-btn {
      background-color: #ffffff;
      border: 1.5px solid #e67e22;
      padding: 8px 16px;
      border-radius: 20px;
      color: #d35400;
      font-weight: bold;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .nav-link:hover, .account-btn:hover {
      background-color: #ffe6d5;
    }

    .main-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .box {
      background-color: #ffffff;
      border: 2px dashed #e67e22;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .header-box h1 {
      margin: 10px 0;
      color: #333;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 15px;
      align-items: stretch;
    }

    .side-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: space-between;
    }

    .image-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fafafa;
      border: 1px dashed #ccc;
      border-radius: 8px;
      min-height: 120px;
      padding: 5px;
    }

    .image-area img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .link-area {
      background-color: #fff3e6;
      border: 1px solid #e67e22;
      padding: 10px;
      border-radius: 8px;
    }

    a {
      color: #d35400;
      font-weight: bold;
      text-decoration: none;
    }

    .video-box {
      min-height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fafafa;
      border: 2px dashed #d35400;
    }

    .forum-box {
      text-align: left;
      padding: 20px;
    }

    .forum-box h2 {
      margin-top: 0;
      color: #d35400;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #e67e22;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
      margin-bottom: 10px;
    }

    button {
      background-color: #e67e22;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
    }

    button:hover {
      background-color: #d35400;
    }

    .comment-card {
      background-color: #fff3e6;
      border: 1px solid #e67e22;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .delete-btn {
      background-color: #e74c3c;
      padding: 5px 10px;
      font-size: 0.8rem;
    }

    .delete-btn:hover {
      background-color: #c0392b;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      border: 2px solid #e67e22;
      border-radius: 12px;
      padding: 25px;
      width: 90%;
      max-width: 450px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      background: none;
      color: #888;
      padding: 0;
    }

    .close-btn:hover {
      background: none;
      color: #000;
    }

    footer {
      text-align: center;
      margin-top: 25px;
      color: #b3541e;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <nav class="nav-bar">
    <button class="account-btn" onclick="openModal()">Account</button>
    <a href="quienes-somos.html" class="nav-link">About Us</a>
  </nav>

  <div class="main-container">
    
    <div class="box header-box">
      <h1>ORANGE DAY</h1>
    </div>

    <div class="content-grid">
      
      <div class="box side-box">
        <div class="image-area">
          <img src="imagen1.png" alt="Image 1">
        </div>
        
        <div class="link-area">
          <a href="podcast.html">Listen to Podcast</a>
        </div>

        <div class="image-area">
          <img src="imagen2.png" alt="Image 2">
        </div>
      </div>

      <div class="box video-box">
      </div>

      <div class="box side-box">
        <div class="image-area">
          <img src="imagen3.png" alt="Image 3">
        </div>

        <div class="link-area">
          <a href="infografia.html">View Infographic</a>
        </div>

        <div class="image-area">
          <img src="imagen4.png" alt="Image 4">
        </div>
      </div>

    </div>

    <div class="box forum-box">
      <h2>Opinion Forum</h2>
      <textarea id="forum-message" rows="4" placeholder="Write your message here..."></textarea>
      <button type="button" onclick="postComment()">Post Comment</button>
      <p id="forum-status" style="font-weight: bold; margin-top: 10px;"></p>
      
      <h3>Recent Comments</h3>
      <div id="public-comments-list"></div>
    </div>

  </div>

  <div class="modal-overlay" id="account-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      
      <div id="login-view">
        <h2>Account Access</h2>
        <input type="text" id="auth-username" placeholder="Username">
        <input type="password" id="auth-password" placeholder="Password">
        <div style="display: flex; gap: 10px;">
          <button type="button" onclick="registerUser()">Sign Up</button>
          <button type="button" onclick="loginUser()" style="background-color: #d35400;">Log In</button>
        </div>
        <p id="auth-status" style="font-weight: bold; margin-top: 10px;"></p>
      </div>

      <div id="admin-view" style="display: none;">
        <h2 style="color: #d35400;">Imperial Dashboard</h2>
        <p>Moderation privileges active.</p>
        
        <h3>Forum Moderation</h3>
        <div id="admin-comments-list" style="max-height: 250px; overflow-y: auto;"></div>
        <button type="button" onclick="logoutUser()" style="margin-top: 15px; background-color: #888;">Log Out</button>
      </div>
    </div>
  </div>

  <footer>
    <p>Orange Day Digital Campaign</p>
  </footer>

  <script>
    let isAdmin = false;

    window.onload = function() {
      loadComments();
    };

    function openModal() {
      document.getElementById('account-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('account-modal').style.display = 'none';
    }

    async function registerUser() {
      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value;
      const status = document.getElementById('auth-status');

      if (!username || !password) {
        status.innerText = "Please enter both username and password.";
        status.style.color = "red";
        return;
      }

      const fakeEmail = `${username.toLowerCase()}@orangeday.local`;

      const { data, error } = await supabase.auth.signUp({
        email: fakeEmail,
        password: password,
        options: { data: { username: username } }
      });

      if (error) {
        status.innerText = "Error: " + error.message;
        status.style.color = "red";
      } else {
        status.innerText = "Account created successfully!";
        status.style.color = "green";
      }
    }

    async function loginUser() {
      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value;
      const status = document.getElementById('auth-status');

      if (!username || !password) {
        status.innerText = "Please enter username and password.";
        status.style.color = "red";
        return;
      }

      const fakeEmail = `${username.toLowerCase()}@orangeday.local`;

      const { data, error } = await supabase.auth.signInWithPassword({
        email: fakeEmail,
        password: password
      });

      if (error) {
        status.innerText = "Error: Invalid credentials.";
        status.style.color = "red";
      } else {
        status.innerText = "Logged in successfully!";
        status.style.color = "green";

        if (username === "Imperial" && password === "Orange Empire") {
          isAdmin = true;
          document.getElementById('login-view').style.display = 'none';
          document.getElementById('admin-view').style.display = 'block';
          loadComments();
        } else {
          setTimeout(closeModal, 1000);
        }
      }
    }

    async function logoutUser() {
      await supabase.auth.signOut();
      isAdmin = false;
      document.getElementById('admin-view').style.display = 'none';
      document.getElementById('login-view').style.display = 'block';
      document.getElementById('auth-status').innerText = "";
      loadComments();
    }

    async function postComment() {
      const { data: { user } } = await supabase.auth.getUser();
      const status = document.getElementById('forum-status');
      const message = document.getElementById('forum-message').value;

      if (!user) {
        status.innerText = "You must log in to post a comment.";
        status.style.color = "red";
        openModal();
        return;
      }

      if (!message.trim()) {
        status.innerText = "Please write a message.";
        status.style.color = "red";
        return;
      }

      const { error } = await supabase
        .from('foro_comentarios')
        .insert([{ user_id: user.id, comentario: message }]);

      if (error) {
        status.innerText = "Error posting comment: " + error.message;
        status.style.color = "red";
      } else {
        status.innerText = "Comment posted!";
        status.style.color = "green";
        document.getElementById('forum-message').value = "";
        loadComments();
      }
    }

    async function loadComments() {
      const { data: comments, error } = await supabase
        .from('foro_comentarios')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) return;

      const publicList = document.getElementById('public-comments-list');
      const adminList = document.getElementById('admin-comments-list');

      publicList.innerHTML = "";
      adminList.innerHTML = "";

      comments.forEach(c => {
        const div = document.createElement('div');
        div.className = 'comment-card';
        div.innerHTML = `<p style="margin:0;">${c.comentario}</p>`;
        publicList.appendChild(div);

        if (isAdmin) {
          const adminDiv = document.createElement('div');
          adminDiv.className = 'comment-card';
          adminDiv.innerHTML = `
            <p style="margin:0;">${c.comentario}</p>
            <button class="delete-btn" onclick="deleteComment(${c.id})">Delete</button>
          `;
          adminList.appendChild(adminDiv);
        }
      });
    }

    async function deleteComment(id) {
      if (!confirm("Are you sure you want to delete this comment?")) return;

      const { error } = await supabase
        .from('foro_comentarios')
        .delete()
        .eq('id', id);

      if (error) {
        alert("Error deleting comment: " + error.message);
      } else {
        loadComments();
      }
    }
  </script>

</body>
</html>
